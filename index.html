<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>FOGO - Control Operativo y Almacén</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <style>
    @layer base { html, body { width: 100%; margin: 0; padding: 0; background-color: #041329; } body { overscroll-behavior: none; } }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface": "#041329", "primary": "#8ed5ff", "secondary": "#4edea3", "surface-container": "#112036", "surface-container-low": "#0d1c32", "surface-container-high": "#1c2a41", "surface-container-lowest": "#010e24", "on-surface": "#d6e3ff", "on-surface-variant": "#bdc8d1" } } } };
  </script>
</head>
<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">
  <header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-md">
    <div class="h-16 px-4 flex items-center justify-between">
      <span class="font-bold text-lg tracking-wider text-on-surface">FOGO PILOTO</span>
      <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-secondary/20">
        <span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
        <span class="text-xs text-secondary font-bold uppercase" id="net-badge">En Línea</span>
      </div>
    </div>
  </header>

  <main class="flex flex-col relative w-full px-4 pt-20 pb-28 min-h-screen">
    <!-- Toast de Notificación -->
    <div id="fogo-toast" class="fixed top-20 left-4 right-4 z-50 transform -translate-y-24 opacity-0 transition-all duration-300 pointer-events-none flex items-center justify-between p-3 rounded-xl shadow-2xl bg-surface-container-high border border-primary/20">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-[22px]" id="fogo-toast-icon">check_circle</span>
        <span class="text-sm font-semibold" id="fogo-toast-msg">Operación completada</span>
      </div>
      <span class="text-xs text-primary font-bold">FOGO OK</span>
    </div>

    <!-- Barra de Sincronización -->
    <div class="flex items-center justify-between bg-surface-container-low p-3 rounded-xl mb-4 shadow">
      <span class="text-xs text-on-surface-variant">Registros pendientes de subida: <strong id="pending-count" class="text-primary">0</strong></span>
      <button onclick="triggerManualSync()" class="flex items-center gap-1 bg-surface-container px-3 py-1.5 rounded-lg text-xs font-bold text-on-surface active:scale-95">
        <span class="material-symbols-outlined text-primary text-[16px]">sync</span> Sincronizar
      </button>
    </div>

    <!-- SECCIÓN 1: PRODUCCIÓN -->
    <section id="view-checklist" class="tab-view flex flex-col gap-4">
      <div class="bg-surface-container p-4 rounded-xl shadow">
        <span class="text-xs text-on-surface-variant uppercase font-bold">Estación de Cocina</span>
        <h2 class="text-xl font-bold text-on-surface">Control de Producción</h2>
        <div class="flex justify-between items-center mt-2">
          <span class="text-sm text-primary font-bold" id="checklist-counter">0 / 0</span>
        </div>
        <div class="w-full h-2.5 bg-surface-container-lowest rounded-full overflow-hidden mt-1">
          <div id="checklist-progress-bar" class="h-full bg-primary transition-all w-0"></div>
        </div>
      </div>
      <div id="checklist-container" class="flex flex-col gap-2"></div>
      <button onclick="addBatchExpress()" class="w-full py-3 rounded-xl bg-primary text-on-primary font-bold shadow active:scale-95">
        +20 Unidades Medallones (Exprés)
      </button>
    </section>

    <!-- SECCIÓN 2: INGRESO DE MERCADERÍA Y FACTURAS -->
    <section id="view-inventario" class="tab-view hidden flex flex-col gap-4">
      <div class="bg-surface-container p-4 rounded-xl shadow">
        <span class="text-xs text-on-surface-variant uppercase font-bold">Almacén y Proveedores</span>
        <h2 class="text-xl font-bold text-on-surface">Recepción con Factura</h2>
      </div>

      <form id="form-inventory" onsubmit="registerInventory(event)" class="bg-surface-container-low p-4 rounded-xl flex flex-col gap-3 shadow">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="inv-proveedor" placeholder="Proveedor (Ej: Carnes SAC)" required class="bg-surface-container-lowest p-2.5 rounded-lg text-sm focus:outline-none"/>
          <input type="text" id="inv-factura" placeholder="Nro Factura (F001-042)" required class="bg-surface-container-lowest p-2.5 rounded-lg text-sm focus:outline-none"/>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <select id="inv-producto" class="bg-surface-container-lowest p-2.5 rounded-lg text-sm focus:outline-none">
            <option value="Medallones de Carne 120g">Medallones de Carne 120g</option>
            <option value="Pollo Crujiente">Pollo Crujiente</option>
            <option value="Papas Rústicas">Papas Rústicas</option>
            <option value="Pan de Papa">Pan de Papa</option>
          </select>
          <div class="flex gap-1">
            <input type="number" id="inv-cantidad" placeholder="Cant" required class="w-full bg-surface-container-lowest p-2.5 rounded-lg text-sm focus:outline-none"/>
            <select id="inv-unidad" class="bg-surface-container-lowest p-2.5 rounded-lg text-xs focus:outline-none">
              <option value="unidades">unid</option>
              <option value="kg">kg</option>
              <option value="litros">lt</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="inv-costo" placeholder="Costo Total S/" step="0.5" required class="bg-surface-container-lowest p-2.5 rounded-lg text-sm focus:outline-none"/>
          <select id="inv-estado" class="bg-surface-container-lowest p-2.5 rounded-lg text-xs focus:outline-none">
            <option value="Físico Recibido">Físico Recibido</option>
            <option value="Foto WhatsApp">Foto WhatsApp</option>
            <option value="Pendiente Factura">Pendiente Factura</option>
          </select>
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-secondary text-on-secondary font-bold shadow active:scale-95">
          Registrar Ingreso y Factura
        </button>
      </form>

      <div class="flex flex-col gap-2">
        <span class="text-xs text-on-surface-variant font-bold uppercase">Ingresos Registrados Hoy</span>
        <div id="inventory-list" class="flex flex-col gap-2"></div>
      </div>
    </section>
  </main>

  <!-- Barra de Navegación Inferior -->
  <nav class="fixed bottom-0 w-full z-50 bg-surface/90 backdrop-blur-xl border-t border-surface-container-high">
    <div class="h-16 flex justify-around items-center">
      <button onclick="switchTab('view-checklist')" class="flex flex-col items-center text-primary font-bold" id="nav-btn-1">
        <span class="material-symbols-outlined text-[22px]">assignment</span>
        <span class="text-[10px]">Producción</span>
      </button>
      <button onclick="switchTab('view-inventario')" class="flex flex-col items-center text-on-surface-variant" id="nav-btn-2">
        <span class="material-symbols-outlined text-[22px]">receipt_long</span>
        <span class="text-[10px]">Almacén & Factura</span>
      </button>
    </div>
  </nav>

  <script>
    // URL corregida con comilla de cierre adecuada
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwkRIVHccwYdjlkRKLL5HyyRg37RQe-knrcskz-fM4mR0fYNVWW7JmRVfPuTMWH4lzgkQ/exec';
    
    let tasks = [
      { id: 't1', name: 'Medallones de Carne 120g', area: 'plancha', current: 30, target: 120, unit: 'unidades', done: false },
      { id: 't2', name: 'Pollo Crujiente Marinado', area: 'cocina', current: 15, target: 60, unit: 'porciones', done: false },
      { id: 't3', name: 'Papas Rústicas Blanqueadas', area: 'cocina', current: 10, target: 40, unit: 'kg', done: false }
    ];
    let inventoryRecords = [];
    let offlineQueue = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadLocalStorage();
      renderChecklist();
      renderInventoryList();
    });

    function showToast(msg, icon = 'check_circle') {
      const toast = document.getElementById('fogo-toast');
      document.getElementById('fogo-toast-msg').textContent = msg;
      document.getElementById('fogo-toast-icon').textContent = icon;
      toast.classList.remove('-translate-y-24', 'opacity-0');
      setTimeout(() => toast.classList.add('-translate-y-24', 'opacity-0'), 2400);
    }

    function switchTab(viewId) {
      document.querySelectorAll('.tab-view').forEach(v => v.classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
      document.getElementById('nav-btn-1').className = viewId === 'view-checklist' ? 'flex flex-col items-center text-primary font-bold' : 'flex flex-col items-center text-on-surface-variant';
      document.getElementById('nav-btn-2').className = viewId === 'view-inventario' ? 'flex flex-col items-center text-primary font-bold' : 'flex flex-col items-center text-on-surface-variant';
    }

    function loadLocalStorage() {
      if (localStorage.getItem('fogo_tasks')) tasks = JSON.parse(localStorage.getItem('fogo_tasks'));
      if (localStorage.getItem('fogo_inv')) inventoryRecords = JSON.parse(localStorage.getItem('fogo_inv'));
      if (localStorage.getItem('fogo_queue')) offlineQueue = JSON.parse(localStorage.getItem('fogo_queue'));
      document.getElementById('pending-count').textContent = offlineQueue.length;
    }

    function saveLocalStorage() {
      localStorage.setItem('fogo_tasks', JSON.stringify(tasks));
      localStorage.setItem('fogo_inv', JSON.stringify(inventoryRecords));
      localStorage.setItem('fogo_queue', JSON.stringify(offlineQueue));
      document.getElementById('pending-count').textContent = offlineQueue.length;
    }

    function renderChecklist() {
      const container = document.getElementById('checklist-container');
      container.innerHTML = '';
      let completed = 0;
      tasks.forEach(t => {
        if (t.done) completed++;
        const card = document.createElement('div');
        card.className = `p-3 rounded-xl flex items-center justify-between ${t.done ? 'bg-surface-container-lowest opacity-75' : 'bg-surface-container-low'}`;
        card.innerHTML = `
          <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="toggleTask('${t.id}')">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center ${t.done ? 'bg-primary text-on-primary' : 'bg-surface-container-high text-on-surface-variant'}">
              <span class="material-symbols-outlined text-[18px]">${t.done ? 'check' : 'radio_button_unchecked'}</span>
            </div>
            <div>
              <span class="text-sm font-bold text-on-surface ${t.done ? 'line-through text-on-surface-variant' : ''}">${t.name}</span>
              <div class="text-xs text-on-surface-variant">${t.current} / ${t.target} ${t.unit}</div>
            </div>
          </div>
          <button onclick="incrementQty('${t.id}', 5)" class="px-3 py-2 rounded-lg bg-surface-container-high text-primary text-xs font-bold active:scale-95">+5</button>
        `;
        container.appendChild(card);
      });
      const pct = Math.round((completed / tasks.length) * 100) || 0;
      document.getElementById('checklist-counter').textContent = `${completed} / ${tasks.length} (${pct}%)`;
      document.getElementById('checklist-progress-bar').style.width = `${pct}%`;
    }

    function toggleTask(id) {
      const t = tasks.find(item => item.id === id);
      if (!t) return;
      t.done = !t.done;
      if (t.done) t.current = t.target;
      saveLocalStorage();
      renderChecklist();
      queueAction({ type: 'task', id: t.id + '_' + Date.now(), timestamp: new Date().toISOString(), ...t });
      showToast(`Actualizado: ${t.name}`);
    }

    function incrementQty(id, delta) {
      const t = tasks.find(item => item.id === id);
      if (!t) return;
      t.current += delta;
      if (t.current >= t.target) t.done = true;
      saveLocalStorage();
      renderChecklist();
      queueAction({ type: 'task', id: t.id + '_' + Date.now(), timestamp: new Date().toISOString(), ...t });
      showToast(`+${delta} sumados a ${t.name}`);
    }

    function addBatchExpress() {
      if (tasks.length > 0) {
        tasks[0].current += 20;
        if (tasks[0].current >= tasks[0].target) tasks[0].done = true;
        saveLocalStorage();
        renderChecklist();
        queueAction({ type: 'task', id: tasks[0].id + '_expr_' + Date.now(), timestamp: new Date().toISOString(), ...tasks[0] });
        showToast('+20 Unidades añadidas');
      }
    }

    function registerInventory(e) {
      e.preventDefault();
      const record = {
        type: 'inventory_in',
        id: 'inv_' + Date.now(),
        timestamp: new Date().toISOString(),
        fecha: new Date().toLocaleDateString('es-PE'),
        proveedor: document.getElementById('inv-proveedor').value,
        nroFactura: document.getElementById('inv-factura').value,
        producto: document.getElementById('inv-producto').value,
        cantidad: parseFloat(document.getElementById('inv-cantidad').value) || 0,
        unidad: document.getElementById('inv-unidad').value,
        costoTotal: parseFloat(document.getElementById('inv-costo').value) || 0,
        responsable: 'Operador Turno',
        estadoComprobante: document.getElementById('inv-estado').value
      };

      inventoryRecords.unshift(record);
      saveLocalStorage();
      renderInventoryList();
      queueAction(record);
      document.getElementById('form-inventory').reset();
      showToast('Ingreso con factura registrado con éxito', 'receipt_long');
    }

    function renderInventoryList() {
      const container = document.getElementById('inventory-list');
      container.innerHTML = '';
      if (inventoryRecords.length === 0) {
        container.innerHTML = `<div class="p-3 bg-surface-container-low rounded-xl text-xs text-on-surface-variant text-center">Sin ingresos registrados hoy</div>`;
        return;
      }
      inventoryRecords.forEach(item => {
        const card = document.createElement('div');
        card.className = "p-3 rounded-xl bg-surface-container-low flex justify-between items-center shadow";
        card.innerHTML = `
          <div>
            <div class="text-sm font-bold">${item.producto} (${item.cantidad} ${item.unidad})</div>
            <div class="text-xs text-on-surface-variant">Prov: ${item.proveedor} | Fac: ${item.nroFactura}</div>
          </div>
          <div class="text-right">
            <div class="text-sm font-bold text-primary">S/ ${item.costoTotal.toFixed(2)}</div>
            <div class="text-[10px] text-secondary font-bold uppercase">${item.estadoComprobante}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function queueAction(actionObj) {
      offlineQueue.push(actionObj);
      saveLocalStorage();
      if (navigator.onLine) syncWithCloud();
    }

    async function syncWithCloud() {
      if (offlineQueue.length === 0 || GAS_URL.includes('TU_SCRIPT_ID')) return;
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ records: offlineQueue })
        });
        offlineQueue = [];
        saveLocalStorage();
        showToast('Sincronizado con Google Sheets', 'cloud_done');
      } catch (e) {
        showToast('Guardado local (sin internet)', 'cloud_off');
      }
    }

    function triggerManualSync() {
      showToast('Sincronizando...', 'sync');
      syncWithCloud();
    }
  </script>
</body>
</html>
