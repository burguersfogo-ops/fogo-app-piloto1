<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>FOGO OPS</title>
<style>
:root{--bg:#05080f;--cd:#0d1422;--ln:#1b2640;--tx:#f2f6ff;--mu:#8a97b5;--ac:#2f7bff;--ok:#2ecc8f;--er:#ff5c5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
header b{font-size:20px;letter-spacing:.5px}header b span{color:var(--ac)}
small,.mu{color:var(--mu);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.chip{background:var(--cd);color:var(--mu);border:1px solid var(--ln);border-radius:20px;padding:8px 14px;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:18px 10px;font-size:15px}
.tile.on{border-color:var(--ac)}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:12px;font-size:16px;margin:6px 0}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;width:100%;font-weight:600}
.lnk{background:none;border:0;color:var(--ac);padding:6px 0}
.er{color:var(--er)}.ok{color:var(--ok)}
.badge{display:inline-block;background:var(--ln);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--tx)}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== CONFIGURACIÓN: pega aquí los dos datos de Supabase (Project Settings > API) ======
const URL_SB = "https://mjxfohbtzqxydcnftond.supabase.co";
const KEY_SB = "sb_publishable_c1YiME8yW93Sd6GqNVCJwg_DCWoA4I9";   // la "anon" o "publishable". NUNCA la "secret" ni "service_role"
// =========================================================================================

const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ROLES = {admin:"Administrador", encargado:"Encargado de Operaciones", empleado:"Empleado"};
const CTX = ["Local","DK","Producción","Evento"];
const TODOS = ["admin","encargado","empleado"], GEST = ["admin","encargado"];
const MODS = [["Tareas",TODOS],["Limpieza",TODOS],["Mermas",TODOS],["Inventario",GEST],["Eventos",GEST],["Compras",GEST],["Caja y pagos",["admin"]],["Personal",["admin"]]];
let sb, yo, ctx = localStorage.getItem("ctx") || "Local";

const lima = () => new Date().toLocaleString("es-PE",{timeZone:"America/Lima",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function toast(t){const e=$("#toast");e.textContent=t;e.className="show";setTimeout(()=>e.className="",2400)}

function login(msg=""){
  $("#app").innerHTML=`<header><b>FOGO <span>OPS</span></b></header>
  <form class=card id=f><h2>Ingresar</h2>
  <input id=e type=email placeholder="Correo" autocomplete=username required>
  <input id=p type=password placeholder="Contraseña" autocomplete=current-password required>
  <p class=er id=m>${esc(msg)}</p><button class=btn>Entrar</button></form>`;
  $("#f").onsubmit=async ev=>{ev.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:$("#e").value.trim(),password:$("#p").value});
    error?$("#m").textContent="Correo o contraseña incorrectos.":entrar()};
}

async function entrar(){
  const {data:{user}}=await sb.auth.getUser();
  const {data,error}=await sb.from("perfiles").select("*").eq("id",user.id).single();
  if(error||!data||!data.activo){await sb.auth.signOut();return login("Tu cuenta no está activa. Habla con administración.")}
  yo=data;home();
}

function shell(inner){
  $("#app").innerHTML=`<header><b>FOGO <span>OPS</span></b><small>${lima()} · Lima</small></header>
  <nav class=chips>${CTX.map(c=>`<button class="chip ${c==ctx?"on":""}" data-c="${c}">${c}</button>`).join("")}</nav>
  <main>${inner}</main>
  <footer><small>${esc(yo.nombre)} · <span class=badge>${ROLES[yo.rol]}</span></small><button class=lnk id=out>Salir</button></footer>`;
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ctx=b.dataset.c;localStorage.setItem("ctx",ctx);home()});
  $("#out").onclick=async()=>{await sb.auth.signOut();login()};
}

function home(){
  shell(`<section class=card><h2>Ahora · ${esc(ctx)}</h2>
  <p class=mu>Aquí aparecerán tus tareas (Bloque 2). Por ahora no hay datos de operación, ni reales ni de ejemplo.</p></section>
  <div class=grid>${MODS.filter(m=>m[1].includes(yo.rol)).map(m=>`<button class=tile data-m="${m[0]}">${m[0]}</button>`).join("")}</div>
  <section class=card><h3>Prueba de permisos</h3>
  <p class=mu>Intenta subirte el rol a Administrador. Si no lo eres, la base de datos debe bloquearlo.</p>
  <button class=btn id=t>Probar</button><p id=r></p></section>`);
  document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>b.dataset.m=="Personal"?personal():toast("Disponible en un próximo bloque"));
  $("#t").onclick=async()=>{
    const {data,error}=await sb.from("perfiles").update({rol:"admin"}).eq("id",yo.id).select();
    const r=$("#r");
    if(error){r.className="ok";r.textContent="✓ Bloqueado: "+error.message}
    else if(!data.length){r.className="ok";r.textContent="✓ Bloqueado por la base de datos"}
    else if(yo.rol=="admin"){r.className="ok";r.textContent="Permitido: ya eres administrador."}
    else{r.className="er";r.textContent="✗ FALLO DE SEGURIDAD: se pudo cambiar el rol. Avísame."}};
}

async function personal(){
  const {data,error}=await sb.from("perfiles").select("*").order("creado_en");
  shell(`<button class=lnk id=b>← Volver</button><h2>Personal</h2>
  ${error?`<p class=er>No se pudo cargar: ${esc(error.message)}</p>`:data.map(p=>`<div class=card>
  <input value="${esc(p.nombre)}" data-id="${p.id}" data-k=nombre>
  <small>${esc(p.email)}${p.id==yo.id?" · (tú)":""}</small>
  <select data-id="${p.id}" data-k=rol ${p.id==yo.id?"disabled":""}>${Object.entries(ROLES).map(([k,v])=>`<option value=${k} ${k==p.rol?"selected":""}>${v}</option>`).join("")}</select>
  <label><input type=checkbox style="width:auto" data-id="${p.id}" data-k=activo ${p.activo?"checked":""} ${p.id==yo.id?"disabled":""}> Activo</label></div>`).join("")}`);
  $("#b").onclick=home;
  $("main").onchange=async e=>{const t=e.target,id=t.dataset.id;if(!id)return;
    const v=t.type=="checkbox"?t.checked:t.value;
    const {data:d,error:er}=await sb.from("perfiles").update({[t.dataset.k]:v}).eq("id",id).select();
    toast(er||!d.length?"No se pudo guardar":"Guardado")};
}

(async()=>{
  if(URL_SB.startsWith("PEGA")||KEY_SB.startsWith("PEGA")){
    $("#app").innerHTML=`<section class=card><h2>Falta conectar Supabase</h2><p class=mu>Abre index.html y pega la URL y la clave pública en las dos primeras líneas del script.</p></section>`;return}
  sb=supabase.createClient(URL_SB,KEY_SB);
  const {data:{session}}=await sb.auth.getSession();
  session?entrar():login();
})();
</script></body></html>
